# Положите этот файл в репозиторий по пути:
# .github/workflows/tracker.yml
# Скрипт tracker.py и state.json должны лежать в корне того же репозитория.

name: GTA VI PC Race -> Telegram

on:
  schedule:
    - cron: "0 * * * *"   # каждый час, время в UTC (важные обновления не привязаны к вашему вечеру, но разброс в несколько минут — норма для Actions)
  workflow_dispatch: {}   # кнопка «Run workflow», чтобы проверить вручную

permissions:
  contents: write         # нужно, чтобы воркфлоу коммитил обновлённый state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить трекер и отправить новое в Telegram
        run: python tracker.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Сохранить состояние
        run: |
          git config user.name "tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "tracker state"
          git push
